name: 오류 보고서
description: 프로그램 사용 중 발견한 문제를 제보할 때 사용해주세요.
title: "[버그] "
labels: ["버그"]
body:
  - type: markdown
    attributes:
      value: |
        소중한 시간을 내어 오류를 제보해주셔서 감사합니다!
        제보 전에 같은 문제가 이미 등록되어 있는지 확인해주세요.
  - type: textarea
    id: bug-description
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했나요?
      placeholder: 문제가 발생한 상황을 간단히 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 문제를 다시 일으키는 방법을 순서대로 적어주세요.
      placeholder: |
        1. '...' 애드온이 설치된 서버에 접속
        2. 스폰 메뉴에서 '...' 엔티티 생성
        3. 엔티티와 상호작용(E 키)하는 중 Lua 오류 발생
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 원래 어떻게 동작해야 하나요?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 애드온 버전
      description: 문제가 발생한 애드온 버전을 적어주세요.
      placeholder: 예) 인벤토리 애드온 v1.2.3
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: 발생 빈도
      options:
        - 항상 발생
        - 가끔 발생
        - 한 번만 발생
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      description: 문제가 미치는 영향은 어느 정도인가요?
      options:
        - 치명적 - 서버 크래시, 플레이어 데이터 손실, 악용 가능한 취약점(익스플로잇)
        - 높음 - 반복적인 Lua 오류 등으로 애드온 주요 기능 사용 불가
        - 보통 - 불편하지만 우회 가능
        - 낮음 - 게임 내 UI 오탈자, 사소한 HUD 표시 문제
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 오류 로그
      description: 콘솔에 출력된 Lua 오류 메시지나 서버 로그가 있다면 붙여 넣어주세요.
      render: shell
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: 스크린샷 및 첨부 파일
      description: 문제를 보여주는 스크린샷이나 파일을 끌어다 놓아주세요.
    validations:
      required: false
